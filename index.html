<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#0d2d22"/><title>ShotTrack V3</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/><link rel="stylesheet" href="styles.css"/></head><body><main class="app-shell"><header class="topbar"><div><span class="eyebrow">SHOTTRACK <b>V3</b></span><h1 id="screenTitle">Your round, mapped.</h1></div><button id="historyBtn" class="icon-btn">History</button></header>
<section id="homeView" class="view"><div class="hero card"><div class="ball-mark">●</div><h2>Tap where it landed.</h2><p>Pick a club, place the ball on the map, and ShotTrack handles distance and scoring.</p><button id="newRoundBtn" class="primary big">Start a round</button><button id="resumeBtn" class="secondary big hidden">Resume current round</button></div><div id="lastRound" class="card hidden"></div></section>
<section id="setupView" class="view hidden"><div class="card form-card"><label>Find course<input id="courseSearch" placeholder="Select your course" autocomplete="off"/></label><button id="searchCourseBtn" class="secondary big">View all courses</button><div id="courseResults" class="course-results"></div><div id="selectedCourse" class="selected-course hidden"></div><div class="grid2"><label>Tees<select id="teeInput"><option>Black</option><option>Blue</option><option>Gold</option><option>Silver</option></select></label><label>Start hole<input id="startHoleInput" type="number" min="1" max="18" value="1"/></label></div><button id="beginBtn" class="primary big" disabled>Tee off</button><button data-home class="text-btn">Cancel</button></div></section>
<section id="roundView" class="view hidden"><div class="round-head card"><div><span id="courseName" class="eyebrow"></span><h2>Hole <span id="holeNum"></span> <small id="holeMeta"></small></h2></div><div class="score-pill"><span>Shots</span><strong id="holeShots">0</strong></div></div><div class="map-card card"><div id="map"></div><div class="map-status"><strong id="mapPrompt">Tap your starting ball position first.</strong><span id="mapReadout">Then choose a club and tap where it lands.</span></div></div><div class="card quick-log"><p class="section-label">Club</p><div id="clubGrid" class="chip-grid"></div><div class="shot-actions"><button id="undoBtn" class="secondary">Undo</button><button id="clearStartBtn" class="text-btn">Reset hole</button></div></div><div class="card"><div class="section-row"><p class="section-label">Shot path</p><span id="totalHoleDistance" class="muted"></span></div><div id="shotList" class="shot-list"></div></div><div class="hole-actions"><button id="prevHoleBtn" class="secondary">← Previous</button><button id="nextHoleBtn" class="primary">Next hole →</button></div><button id="finishBtn" class="text-btn danger finish">Finish round</button></section>
<section id="summaryView" class="view hidden"><div class="card summary-hero"><span class="eyebrow">ROUND COMPLETE</span><h2 id="summaryCourse"></h2><div class="big-score" id="summaryScore"></div><p id="summaryVsPar"></p></div><div id="summaryStats" class="stat-grid"></div><div class="card"><p class="section-label">Hole-by-hole</p><div id="holeSummary"></div></div><button data-home class="primary big">Done</button></section><section id="historyView" class="view hidden"><div id="historyList"></div><button data-home class="secondary big">Back</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdbIKm6_GtozQq7-nNZfvpOd06yvgPhXk&loading=async&libraries=places"></script><script src="google-map.js?v=3"></script><script src="app.js?v=20260915-v3"></script><script src="course-picker.js?v=20260915-golf-filter-1"></script><script src="hole-experience.js?v=20260915-manual-lie"></script><script src="v3-experience.js?v=20260915-manual-lie"></script></body></html>
